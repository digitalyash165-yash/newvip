<style>

* {

    padding: 0;

html,

    background: #000;

/* ================= MAIN CARD ================= */

.card {

    min-height: 90vh;

    border: 2px solid rgba(255, 215, 0, 0.40);

    border-radius: 32px;

    background:

            rgba(255, 215, 0, 0.08),

    align-items: center;
    justify-content: center;
}


/* ================= PHOTO ================= */

.profile {

    width: 128px;
    height: 128px;

    border-radius: 50%;

    object-fit: cover;

    border: 5px solid #ffd21c;

    box-shadow:
        0 0 25px rgba(255, 215, 0, 0.65);

    margin-bottom: 42px;
}

    display: flex;

    align-items: center;

    justify-content: center;

    text-align: center;

    text-decoration: none;

    font-size: 20px;

    font-weight: 800;

    padding: 15px 20px;

    box-shadow:
        0 12px 35px rgba(0, 174, 255, 0.32);

    margin-bottom: 42px;

    transition: transform 0.2s ease;
}

.telegram:active {

    transform: scale(0.97);
